models:
  - name: dim_listings_cleansed
    description: "Cleansed table which contains Airbnb listings."
    tests:
      - minimum_row_count:
          arguments:
            min_row_count: 10000000
            # severity: error
    columns:
      - name: listing_id
        description: "Primary key for the listing"
        tests:
          - not_null
          - unique
      - name: host_id
        description: "The host's id. References the host table"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id
      - name: room_type
        description: "Type of the apartment / room"
        tests:
          - accepted_values:
              arguments:
                values: [ 'Entire home/apt', 'Private room', 'Shared room', 'Hotel room' ]

      - name: minimum_nights
        description: '{{doc("dim_listing_cleansed__minimum_nights")}}'
        tests:
          - positive_value

  - name: dim_hosts_cleansed
    versions:
      - v: 1
        defined_in: dim_hosts_cleansed
        deprecation_date: 2030-01-01
      - v: 2
        columns:
          - include: '*'
            exclude: [ host_name ]
          - name: host_name
            description: The name of the host (N/A if not available)
            data_type: string
            constraints:
              - type: not_null
    latest_version: 2
    description: "Cleansed table which contains Airbnb hosts."
    config:
      contract:
        enforced: true
    columns:
      - name: host_id
        description: "Primary key for the host"
        data_type: integer
        constraints:
          - type: not_null
        tests:
          - unique
      - name: host_name
        description: "The host's name"
        data_type: string
        constraints:
          - type: not_null
      - name: is_superhost
        description: "Indicates if the host is a superhost"
        data_type: string
        tests:
          - accepted_values:
              arguments:
                values: [ 't', 'f' ]
      - name: updated_at
        description: "Timestamp of when the host record was last updated"
        data_type: timestamp
      - name: created_at
        description: "Timestamp of when the host record was created"
        data_type: timestamp

  - name: dim_listings_w_hosts
    tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: source('airbnb', 'listings')
    columns:
      - name: price
        tests:
          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: number
          - dbt_expectations.expect_column_quantile_values_to_be_between:
              arguments:
                quantile: 0.99
                min_value: 50
                max_value: 500
          - dbt_expectations.expect_column_max_to_be_between:
              config:
                severity: warn
              arguments:
                max_value: 5000
  - name: legacy_int_host_performance
    columns:
      - name: host_id
        description: Unique identifier for each host, sourced from the raw hosts data.
        data_type: number
        data_tests:
          - not_null
          - unique
      - name: host_name
        description: Name of the host, as recorded in the raw hosts data.
        data_type: varchar
      - name: host_since
        description: Timestamp indicating when the host account was created, representing the host's tenure start date.
        data_type: timestamp_ntz
      - name: host_is_superhost
        description: Indicates whether the host is a superhost. Values are 't' for true and 'f' for false.
        data_type: varchar
      - name: total_listings
        description: The total number of unique listings associated with the host.
        data_type: number
      - name: entire_home_count
        description: The count of listings where the room type is 'Entire home/apt' for the host.
        data_type: number
      - name: private_room_count
        description: The number of listings associated with the host that are categorized as private rooms.
        data_type: number
      - name: shared_room_count
        description: The number of listings associated with the host that are categorized as shared rooms.
        data_type: number
      - name: hotel_room_count
        description: The number of listings associated with the host that are categorized as hotel rooms.
        data_type: number
      - name: avg_listing_price
        description: The average price of all listings associated with a host, calculated by taking the mean of the cleaned price values for the host's listings.
        data_type: number
      - name: min_listing_price
        description: The minimum price among all listings associated with a host, representing the lowest cleaned price value for the host's listings.
        data_type: number
      - name: max_listing_price
        description: The maximum price among all listings associated with a host, representing the highest cleaned price value for the host's listings.
        data_type: number
      - name: avg_minimum_nights
        description: The average number of minimum nights required across all listings associated with the host.
        data_type: number
      - name: min_minimum_nights
        description: The smallest number of minimum nights required among all listings associated with the host.
        data_type: number
      - name: max_minimum_nights
        description: The largest number of minimum nights required among all listings associated with the host.
        data_type: number
      - name: portfolio_size
        description: Categorizes the host's portfolio based on the number of listings they manage. Possible values include 'inactive', 'single_listing', 'small_portfolio', 'medium_portfolio', and 'large_portfolio'.
        data_type: varchar
      - name: host_status
        description: Indicates whether the host is a 'superhost' or a 'standard' host based on the 'is_superhost' flag from the raw data.
        data_type: varchar
      - name: host_tenure
        description: Classifies the host's experience level based on the duration since they started hosting. Possible values include 'unknown', 'new_host', 'experienced_host', and 'veteran_host'.
        data_type: varchar
      - name: days_as_host
        description: The total number of days a host has been active on the platform, calculated as the difference between the current date and the host's signup date.
        data_type: number
      - name: dominant_room_type
        description: The room type that constitutes the majority of a host's listings, determined by comparing the counts of 'Entire home/apt', 'Private room', 'Shared room', and 'Hotel room' listings.
        data_type: varchar
    description: The legacy_int_host_performance model aggregates and analyzes host performance data from Airbnb. It combines raw host and listing data to provide insights into host activity, portfolio size, pricing, tenure, and dominant room type. This model is designed to support business decisions by categorizing hosts based on their activity levels, tenure, and portfolio characteristics.
