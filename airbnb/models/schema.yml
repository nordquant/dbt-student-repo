models:

  # ============================================================
  # DIM LISTINGS CLEANSED
  # ============================================================

  - name: dim_listings_cleansed
    description: "This table contains the cleansed listings data from Airbnb."
    data_tests:
      - minimum_row_count:
          arguments:
            min_rows: 1000
    columns:

      - name: listing_id
        data_tests:
          - unique
          - not_null

      - name: host_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: "The type of room offered for rent."
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 'Entire home/apt'
                  - 'Private room'
                  - 'Shared room'
                  - 'Hotel room'
      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights")}}'
        data_tests:
          - positive_values

  # ============================================================
  # DIM HOSTS CLEANSED
  # ============================================================

  - name: dim_hosts_cleansed
    description: "This table contains the cleansed hosts data from Airbnb."
    config:
      contract:
        enforced: true

    columns:

      - name: host_id
        description: "The unique identifier for each host."
        data_type: integer
        data_tests:
          - unique
          - not_null

      - name: host_name
        description: "The name of the host."
        data_type: string
        data_tests:
          - not_null

      - name: is_superhost
        description: "Indicates whether the host is a superhost ('t' for true, 'f' for false)."
        data_type: string
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - 't'
                  - 'f'

      - name: updated_at
        description: "The timestamp when the host record was last updated."
        data_type: timestamp

      - name: created_at
        description: "The timestamp when the host record was created."
        data_type: timestamp