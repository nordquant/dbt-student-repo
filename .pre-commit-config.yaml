repos:
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.1.0   # Usa la última versión estable
    hooks:
      - id: sqlfluff-lint
        args: [--dialect, snowflake]
        additional_dependencies: ['sqlfluff-templater-dbt']
      - id: sqlfluff-fix
        args: [--dialect, snowflake]
        additional_dependencies: ['sqlfluff-templater-dbt']
