name: Prod deploy (on merge to main / manual)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Production deps and build
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT: "${{ secrets.SNOWFLAKE_ACCOUNT }}"
      DBT_USER: "${{ secrets.DBT_USER }}"
      PRIVATE_KEY: "${{ secrets.PRIVATE_KEY }}"
      PRIVATE_KEY_PASSPHRASE: "${{ secrets.PRIVATE_KEY_PASSPHRASE }}"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv python install 3.13
      - run: uv sync
      - run: test -n "$SNOWFLAKE_ACCOUNT" || (echo "SNOWFLAKE_ACCOUNT missing" && exit 1)
      - run: test -n "$DBT_USER" || (echo "DBT_USER missing" && exit 1)
      - run: test -n "$PRIVATE_KEY" || (echo "PRIVATE_KEY missing" && exit 1)
      - run: test -n "$PRIVATE_KEY_PASSPHRASE" || (echo "PRIVATE_KEY_PASSPHRASE missing" && exit 1)
      - name: Upload prod target as artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-target
          path: airbnb/target/
          retention-days: 90
